name: Build WinPadClient IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          echo "==== Repository root ===="
          pwd
          ls -la

      - name: Check iPad project
        run: |
          echo "==== iPad project directory ===="
          ls -la WinPadDisplay_MVP_Starter/ipad/WinPadClientProject

          echo "==== Xcode project ===="
          ls -la WinPadDisplay_MVP_Starter/ipad/WinPadClientProject/WinPadClient.xcodeproj

      - name: Build unsigned iPad app
        working-directory: WinPadDisplay_MVP_Starter/ipad/WinPadClientProject
        run: |
          set -euo pipefail

          rm -rf build

          xcodebuild \
            -project WinPadClient.xcodeproj \
            -scheme WinPadClient \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: WinPadDisplay_MVP_Starter/ipad/WinPadClientProject
        run: |
          set -euo pipefail

          APP_PATH="build/Build/Products/Release-iphoneos/WinPadClient.app"

          echo "==== Looking for app ===="
          echo "$APP_PATH"

          test -d "$APP_PATH"

          rm -rf Payload
          rm -f WinPadClient-unsigned.ipa

          mkdir Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -qry WinPadClient-unsigned.ipa Payload

          echo "==== IPA generated ===="
          ls -lh WinPadClient-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinPadClient-unsigned-IPA
          path: WinPadDisplay_MVP_Starter/ipad/WinPadClientProject/WinPadClient-unsigned.ipa
          if-no-files-found: error
